# Allows administrators to manage store assignments for buyer accounts.
# Users with this permission can assign and update the stores that
# buyers are permitted to access.
manage buyer store assignments:
  title: 'Manage buyer store assignments'
  description: 'Assign and update allowed stores for buyer accounts.'

# Allows updating a user's verification status.
update user verification:
  title: 'Update user verification'
  description: 'Update a user verification status.'

# Allows users to access the seller dashboard.
access seller dashboard:
  title: 'Access seller dashboard'
  description: 'View the seller dashboard.'
