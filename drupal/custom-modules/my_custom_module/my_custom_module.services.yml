services:
  my_custom_module.route_subscriber:
    class: Drupal\my_custom_module\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }

  # Redirects anonymous users to the custom Google login page.
  my_module.force_google_login_subscriber:
    class: Drupal\my_custom_module\EventSubscriber\ForceGoogleLoginSubscriber
    arguments:
      - '@current_user'
      - '@language_manager'
    tags:
      - { name: event_subscriber }

  # Resolves the buyer's store based on the current context.
  my_custom_module.buyer_store_resolver:
    class: Drupal\my_custom_module\Service\BuyerStoreResolver
    arguments: ['@entity_type.manager']

  my_custom_module.seller_access_subscriber:
    class: Drupal\my_custom_module\EventSubscriber\SellerAccessSubscriber
    arguments:
      - '@current_user'
      - '@current_route_match'
    tags:
      - { name: event_subscriber }

  my_custom_module.current_store:
    class: Drupal\my_custom_module\Service\CurrentStore
    arguments: ['@request_stack']

  my_custom_module.store_context_subscriber:
    class: Drupal\my_custom_module\EventSubscriber\StoreContextSubscriber
    arguments: ['@request_stack']
    tags:
      - { name: event_subscriber }

  # Generates and validates buyer invitation codes.
  my_custom_module.invitation_code:
    class: Drupal\my_custom_module\Service\InvitationCodeGenerator
    arguments:
      # Drupal time service.
      - '@datetime.time'

  # Handles buyer verification and store assignment logic.
  my_custom_module.buyer_verification_manager:
    class: Drupal\my_custom_module\Service\BuyerVerificationManager
    arguments:
      # Invitation code generator service.
      - '@my_custom_module.invitation_code'

      # Buyer store resolver service.
      - '@my_custom_module.buyer_store_resolver'

      # Entity type manager for loading and saving user entities.
      - '@entity_type.manager'

  # Service responsible for importing product data.
  # Injects Drupal core services required for entity management,
  # logging, HTTP requests, file handling, language management,
  # database access, file system operations, image validation caching,
  # and key-value storage.
  my_custom_module.grocery_import:
    class: Drupal\my_custom_module\Service\GroceryImportService
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@http_client'
      - '@file.repository'
      - '@language_manager'
      - '@database'
      - '@file_system'
      - '@cache.my_custom_module_image_validation'
      - '@keyvalue'
      - '@datetime.time'

  # Cache backend used to store image validation results for the
  # my_custom_module grocery import service.
  cache.my_custom_module_image_validation:
    class: Drupal\Core\Cache\DatabaseBackend
    factory: ['@cache_factory', 'get']
    arguments: ['my_custom_module_image_validation']

  my_custom_module.event_subscriber:
    class: Drupal\my_custom_module\EventSubscriber\SocialAuthLanguageSubscriber
    arguments:
      - '@language_manager'
      - '@social_auth.data_handler'
      - '@logger.factory'
      - '@request_stack'
    tags:
      - { name: event_subscriber }
