my_custom_module.settings:
  path: '/admin/my-site'
  defaults:
    _form: '\Drupal\my_custom_module\Form\AdminSettingsForm'
  requirements:
    _permission: 'administer site configuration'

# Public login page used to initiate Google authentication.
# Anonymous users are redirected here by the
# ForceGoogleLoginSubscriber.
my_custom_module.custom_login:
  path: '/custom-login'
  defaults:
    _title: 'Login'
    _controller: '\Drupal\my_custom_module\Controller\LoginController::loginPage'
  requirements:
    _access: 'TRUE'

# Landing page used after authentication to determine the
# appropriate user destination and perform any required redirects.
my_custom_module.user_login_redirect:
  path: '/user-login-redirect'
  defaults:
    _controller: '\Drupal\my_custom_module\Controller\UserLoginRedirectController::landing'
    _title: 'User Login Redirect'
  requirements:
    _access: 'TRUE'

# Landing page used after authentication to determine the
# appropriate buyer destination and perform any required redirects.
my_custom_module.buyer_login_redirect:
  path: '/buyer-login-redirect'
  defaults:
    _controller: '\Drupal\my_custom_module\Controller\BuyerLoginRedirectController::landing'
    _title: 'Buyer Login Redirect'
  requirements:
    _access: 'TRUE'

# Seller dashboard route.
my_custom_module.seller_dashboard:
  path: '/home/seller'
  defaults:
    _controller: '\Drupal\my_custom_module\Controller\SellerDashboardController::dashboard'
    _title: 'Seller Dashboard'
  requirements:
    _permission: 'access seller dashboard'

# Displays the role selection page for authenticated users.
my_custom_module.home:
  path: '/home'
  defaults:
    _controller: '\Drupal\my_custom_module\Controller\HomeController::home'
    _title: 'Home'
  requirements:
    # Only authenticated users can access this route.
    _user_is_logged_in: 'TRUE'

# Displays the product import status for a specific Commerce store.
my_custom_module.import_status:
  # URL path containing the Commerce store ID as a dynamic parameter.
  path: '/store/{commerce_store}/products-import-status'

  defaults:
    # Controller method responsible for displaying the import status.
    _controller: '\Drupal\my_custom_module\Controller\ImportStatusController::status'

    # Page title displayed in the Drupal UI.
    _title: 'Import status'

  requirements:
    # Only users with permission to administer Commerce stores
    # can access this route.
    _permission: 'administer commerce stores'

  options:
    parameters:
      # Automatically converts the {commerce_store} route parameter
      # into a Commerce Store entity using Drupal's entity type system.
      commerce_store:
        type: entity:commerce_store

my_custom_module.test_user_login:
  path: '/test-user-login'
  defaults:
    _title: 'Test user login'
    _form: 'Drupal\my_custom_module\Form\CustomLoginForm'
  requirements:
    _access: 'TRUE'

my_custom_module.json_url:
  path: '/admin/config/system/json-url'
  defaults:
    _title: 'Frontend Json url'
    _form: 'Drupal\my_custom_module\Form\JsonUrlForm'
  requirements:
    _permission: 'administer site configuration'

my_custom_module.ip_currency_rate:
  path: '/api/get-ip-to-currency-rate'
  defaults:
    _title: 'Ip to Currency rate'
    _controller: '\Drupal\my_custom_module\Controller\IpCurrencyRateController::getCurrencyRate'
  requirements:
    _permission: 'access content'
  methods: [GET]
