name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make ci script executable
        run: chmod +x ./scripts/ci.sh

      - name: Run ci
        run: ./scripts/ci.sh
