name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make test script executable
        run: chmod +x ./scripts/ci.sh

      - name: Run tests
        run: ./scripts/ci.sh
